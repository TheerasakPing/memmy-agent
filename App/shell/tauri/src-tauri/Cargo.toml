[package]
name = "memmy-turbo-tauri"
version = "1.2.4"
edition = "2021"
description = "Memmy desktop native Rust / Tauri v2 shell"

[lib]
name = "memmy_turbo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
