[package]
name = "memmy-turbo-tauri"
version = "1.2.5-alpha.3"
edition = "2021"
description = "Memmy desktop native Rust / Tauri v2 shell"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "memmy_turbo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2.11.0"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
image_codec = { package = "image", version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
