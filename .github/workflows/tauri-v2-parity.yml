name: Tauri v2 Rust + React migration validation

on:
  pull_request:
    paths:
      - 'App/frontend/desktop/src/tauri-bridge.ts'
      - 'App/frontend/desktop/src/tests/tauri-bridge.test.ts'
      - 'App/frontend/desktop/src/main.tsx'
      - 'App/shell/tauri/**'
      - 'App/backend/src/index.ts'
      - 'docs/engineering/tauri/**'
      - 'scripts/engineering/tauri-parity.mjs'
      - '.github/workflows/tauri-v2-parity.yml'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-react:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Memory SQLite native bindings for real sidecar smoke
        run: npm rebuild better-sqlite3 sqlite-vec --foreground-scripts
      - run: node scripts/engineering/tauri-parity.mjs --check
      - run: npm run typecheck -w @memmy/frontend-desktop
      - run: npm run build -w @memmy/backend
      - run: npm run memory:build
      - run: npm run sidecar:test -w @memmy/tauri-shell
      - run: npm exec -w @memmy/frontend-desktop -- vitest run src/tests/tauri-bridge.test.ts

  tauri-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: App/shell/tauri/src-tauri
      - name: Tauri system libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: cargo check --locked --manifest-path App/shell/tauri/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path App/shell/tauri/src-tauri/Cargo.toml

# This workflow is NOT release parity: all 85 native methods plus signed OS
# installer E2E must pass before replacing the shipping Electron app.
